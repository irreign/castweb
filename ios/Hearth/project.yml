\
name: Hearth
options:
  bundleIdPrefix: com.irreign
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0

targets:
  Hearth:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Hearth
        excludes:
          - "Resources/Assets.xcassets"
          - "Resources/Info.plist"
          - "Resources/Hearth.entitlements"
      - path: Sources/Hearth/Resources/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Sources/Hearth/Resources/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSUserNotificationsUsageDescription: "Hearth uses notifications for new messages and family calendar updates."
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.irreign.hearth.invite
            CFBundleURLSchemes: [hearth]
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    entitlements:
      path: Sources/Hearth/Resources/Hearth.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irreign.hearth
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    configFiles:
      Debug: Config/Dev.xcconfig
      Release: Config/Prod.xcconfig

  HearthTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HearthTests
    dependencies:
      - target: Hearth
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Hearth:
    build:
      targets:
        Hearth: all
        HearthTests: [test]
    test:
      targets:
        - HearthTests
    run:
      config: Debug
    archive:
      config: Release
